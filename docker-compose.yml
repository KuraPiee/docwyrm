version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: docwyrm-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: docwyrm
      POSTGRES_USER: docwyrm_admin
      POSTGRES_PASSWORD: docwyrm_secret_password
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    container_name: docwyrm-redis
    restart: unless-stopped
    ports:
      - "6379:6379"

  minio:
    image: minio/minio:RELEASE.2024-01-31T20-20-31Z
    container_name: docwyrm-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: docwyrm_minio
      MINIO_ROOT_PASSWORD: docwyrm_minio_secret
    volumes:
      - miniodata:/data
    ports:
      - "9000:9000"
      - "9001:9001"

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    container_name: docwyrm-api
    restart: unless-stopped
    environment:
      PORT: 4000
      DATABASE_URL: postgresql://docwyrm_admin:docwyrm_secret_password@postgres:5432/docwyrm
      REDIS_URL: redis://redis:6379
      JWT_SECRET: super_jwt_secret_key_change_me
    depends_on:
      - postgres
      - redis
    ports:
      - "4000:4000"

  collab:
    build:
      context: .
      dockerfile: docker/Dockerfile.collab
    container_name: docwyrm-collab
    restart: unless-stopped
    environment:
      PORT: 4001
      DATABASE_URL: postgresql://docwyrm_admin:docwyrm_secret_password@postgres:5432/docwyrm
    depends_on:
      - postgres
    ports:
      - "4001:4001"

  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.worker
    container_name: docwyrm-worker
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://docwyrm_admin:docwyrm_secret_password@postgres:5432/docwyrm
      REDIS_URL: redis://redis:6379
    depends_on:
      - postgres
      - redis

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
    container_name: docwyrm-web
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:4000
      NEXT_PUBLIC_COLLAB_URL: ws://localhost:4001
    ports:
      - "3000:3000"
    depends_on:
      - api
      - collab

volumes:
  pgdata:
  miniodata:
